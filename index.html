<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://login.microsoftonline.com https://tia-authority-1ca764.eastasia.cloudapp.azure.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>無限深淵｜營運管理中心</title><link rel="stylesheet" href="style.css"></head>
<body><header><img src="assets/rules.png" alt=""><div><span class="eyebrow">THE INFINITE ABYSS</span><h1>營運管理中心</h1></div><span id="identity">管理員登入</span><button id="signout" hidden>登出</button></header>
<main><section id="login" class="login card"><img src="assets/block.png" alt="社群守護"><span class="eyebrow">COMMUNITY GUARD</span><h2>守護每一次相遇</h2><p>審查檢舉與申訴、處理客服案件，並核對伺服器健康。</p><p class="muted">限定授權管理員，登入須通過 Microsoft 多重要素驗證。玩家資料僅在驗證後由伺服器取得。</p><button id="signin" class="primary">使用 Microsoft 帳號登入</button><p id="setup" class="muted"></p></section>
<section id="workspace" hidden><nav aria-label="管理功能"><button data-page="cases" class="selected"><img src="assets/report.png" alt="">檢舉案件 <span id="case-count">0</span></button><button data-page="appeals"><img src="assets/appeal.png" alt="">申訴管理 <span id="appeal-count">0</span></button><button data-page="audit"><img src="assets/rules.png" alt="">操作紀錄</button><button data-page="support">客服案件</button><button data-page="lookup">玩家查詢</button><button data-page="health">系統健康</button><button id="refresh">重新整理</button></nav>
<div class="work-grid"><section class="card list"><div class="section-title"><h2 id="list-title">檢舉案件</h2><span class="muted" id="updated">登入後讀取</span></div><div id="records"></div><footer><button id="previous">上一頁</button><span id="page-number">1</span><button id="next">下一頁</button></footer></section><section class="card detail" id="detail"><div class="empty"><img src="assets/report.png" alt=""><h2>選擇一筆案件</h2><p>只顯示與案件相關的必要證據。所有證據檢視與處理均會留下操作紀錄。</p></div></section></div></section>
<p id="status" role="status" aria-live="polite"></p><footer class="site-footer">無限深淵 · 授權管理專用　｜　前端不保存玩家資料或管理密鑰</footer></main>
<dialog id="confirm"><form method="dialog"><h2>確認處理</h2><p id="confirm-text"></p><label>處理理由（玩家可見）<textarea id="decision-reason" maxlength="500" required></textarea></label><label id="duration-label">期限<select id="duration"><option value="1">1 小時</option><option value="24" selected>24 小時</option><option value="72">3 天</option><option value="168">7 天</option><option value="720">30 天</option></select></label><label id="target-label">請輸入對象的玩家 ID 確認<input id="confirm-target" autocomplete="off"></label><div class="actions"><button value="cancel" formnovalidate>返回</button><button id="confirm-submit" value="submit" class="primary">確認執行</button></div></form></dialog>
<script src="vendor/msal-browser.min.js"></script><script src="app.js" type="module"></script></body></html>
